# AgentScope 运行配置。真实凭据通过部署环境注入。
iceeboot:
  agent:
    encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:}
    encryption-key-id: ${AI_CONFIG_ENCRYPTION_KEY_ID:primary}
    decryption-keys:
      legacy: ${AI_CONFIG_LEGACY_ENCRYPTION_KEY:}
    daily-model-request-limit: ${AGENT_DAILY_MODEL_REQUEST_LIMIT:1000}
    max-model-requests-per-run: ${AGENT_MAX_MODEL_REQUESTS_PER_RUN:100}
    workspace: ${AGENT_WORKSPACE:./.agentscope/iceeboot}
    project-api-base-url: ${AGENT_PROJECT_API_BASE_URL:http://127.0.0.1:9000/iceeboot/api}
    execution-timeout-seconds: ${AGENT_EXECUTION_TIMEOUT_SECONDS:300}
    max-concurrent-runs: ${AGENT_MAX_CONCURRENT_RUNS:8}
    e2b:
      api-key: ${ALIYUN_E2B_API_KEY:}
      api-base-url: ${ALIYUN_E2B_API_BASE_URL:}
      domain: ${ALIYUN_E2B_DOMAIN:}

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zboot?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:111111}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      # 连接空闲超时时间（毫秒）- 10分钟
      idle-timeout: 600000
      pool-name: IceeBootHikariCP
      # 连接最大生存时间（毫秒）- 25分钟，小于MySQL的wait_timeout
      max-lifetime: 1500000
      # 连接超时时间（毫秒）- 30秒
      connection-timeout: 30000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 验证连接的超时时间（毫秒）
      validation-timeout: 5000
      # 应用关闭时的连接池关闭超时时间（毫秒）
      initialization-fail-timeout: 1
      # 连接泄漏检测阈值（毫秒），0表示禁用
      leak-detection-threshold: 60000
      # 是否在获取连接时测试连接的有效性
      connection-init-sql: SELECT 1
      # 保持连接活跃的时间间隔（毫秒）
      keepalive-time: 300000



  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:111111}
      database: ${REDIS_DATABASE:0}
      timeout: 10000
      lettuce:
        pool:
          min-idle: 0
          max-idle: 16
          max-active: 16
          max-wait: -1ms
    # MongoDB配置（默认关闭）
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:iceeboot}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
      auto-index-creation: false

  # Elasticsearch配置（默认关闭）
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:false}
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:1111111111}
    password: ${ES_PASSWORD:1111111111}
    repositories:
      enabled: ${ELASTICSEARCH_REPOSITORIES_ENABLED:false}

  # 自动配置排除（禁用MongoDB自动配置）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  # RabbitMQ配置（默认关闭）
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}


logging:
  level:
    com.iceeboot: info
    org.springframework: warn
    org.mybatis: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/iceeboot-test.log
    max-size: 50MB
    max-history: 30

# MyBatis Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0



# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: iceeboot API文档 - 测试环境
    description: iceeboot超级脚手架API接口文档 - 测试环境
    version: 1.0.0
    concat: CodeIcee
    url: https://github.com/CodeIcee
    email: codeicee@gmail.com
    license: Apache 2.0
    license-url: https://www.apache.org/licenses/LICENSE-2.0
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    swagger-model-name: 实体类列表
    enable-document-manage: true
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: ""
    enable-home-custom: true
    home-custom-path: classpath:markdown/home.md
    enable-search: true
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Apache License 2.0 | Copyright  2025-[CodeIcee](https://github.com/CodeIcee)
    enable-dynamic-parameter: false
    enable-debug: false
    enable-open-api: false
    enable-group: true
  cors: false
  production: false

YunGouOS:
  mchId: xxx
  key: xxx
  ## 支付回掉
  notifyUrl: http://127.0.0.1:9000/iceeboot/api/v1/pay/callback
  ## 前端地址（微信授权后重定向到前端）
  frontendUrl: http://127.0.0.1:5173
  ## 微信OAuth回调地址（后端接口，由微信服务器调用）
  wechatCallbackUrl: http://127.0.0.1:9000/iceeboot/api/v1/auth/wechat/callback
  ## State密钥（用于生成state参数，防CSRF攻击）
  stateSecret: iceeboot-wechat-login-state-secret-2025
  stateExpireSeconds: 300
  ## 登录ticket有效期（秒）
  ticketExpireSeconds: 120
