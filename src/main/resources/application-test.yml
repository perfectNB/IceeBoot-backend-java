# 测试环境配置
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 500
    connection-timeout: 20000

# 数据源配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://8.146.211.177:3306/zboot?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: zboot
    password: 123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 50
      auto-commit: true
      idle-timeout: 30000
      pool-name: ZbootHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 10
          max-wait: -1ms
          max-idle: 8
          min-idle: 2

# 日志配置
logging:
  level:
    com.zboot: debug
    org.springframework: info
    org.mybatis: debug
    org.springframework.test: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/zboot-test.log
    max-size: 100MB
    max-history: 15

# Sa-Token配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  activity-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true

# ZBoot配置
zboot:
  name: ZBoot测试环境
  version: 1.0.0
  copyrightYear: 2025
  demoEnabled: true
  profile: /Users/cengnanbin/Downloads/JAVA/MyProject/server/base/zboot-backend-java/uploadPath/test
  addressEnabled: false
  captcha:
    enabled: false
    type: math
  xss:
    enabled: true
    excludes: /system/notice
    urlPatterns: /system/*,/monitor/*,/tool/*