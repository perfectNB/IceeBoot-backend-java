#
# @Description: 应用配置文件
# @Date: 2025-08-11
# @Author: CodeIcee
#

server:
  port: 9000
  servlet:
    context-path: /iceeboot/api
    encoding:
      enabled: true
      force: true
      charset: UTF-8
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
  # 优雅关闭配置
  shutdown: graceful

spring:
  application:
    name: iceeboot-backend-java
  profiles:
    active: ${APP_PROFILE:test}
  main:
    allow-bean-definition-overriding: true
  # 优雅关闭超时时间
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: IceeBoot-Scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s
  # 排除Spring Security、Elasticsearch、RabbitMQ自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration

  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  
  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.iceeboot.domain

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: accessToken
  # token有效期，单位s 默认2小时
  timeout: 7200
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: true
  # token风格
  token-style: random-128
  # 是否输出操作日志
  is-log: false
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从header中读取token
  is-read-header: true
  # 是否从body中读取token
  is-read-body: false
  # token前缀
  token-prefix: 
  # jwt秘钥（通过环境变量注入，禁止硬编码）
  jwt-secret-key: ${JWT_SECRET_KEY:please-set-a-secure-random-key-at-least-256-bits}

# 日志配置
logging:
  level:
    com.iceeboot: info
    org.springframework: warn
    org.mybatis: warn
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/iceeboot.log
    max-size: 10MB
    max-history: 30

# Spring Boot Actuator配置
management:
  health:
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.iceeboot.framework.controller
  paths-to-match: /iceeboot/api/**, /v1/**, /api/v1/**



# 自定义配置
iceeboot:
  # 名称
  name: iceeboot超级脚手架
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2025
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/iceeboot/uploadPath，Linux配置 /home/iceeboot/uploadPath）
  profile: /home/iceeboot/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 日志存储配置
  log:
    # 是否启用日志存储到数据库
    enabled: true
    # 日志存储级别 (DEBUG, INFO, WARN, ERROR)
    level: INFO
    # 是否异步存储
    async: true
    # 日志保留天数
    retention-days: 30
    # 批量保存大小
    batch-size: 100
    # 是否记录请求参数
    log-request-params: false
    # 是否记录响应结果
    log-response-result: false
    # 排除的路径模式
    exclude-patterns:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /knife4j/**
  cors:
    allowed-origins: http://localhost:4396,http://127.0.0.1:4396
    allowed-headers: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allow-credentials: true
    max-age: 3600
  auth:
    refresh-token-expire-seconds: 604800
    wechat-default-role-id: 3
    exclude-paths:
      # 支付平台通过签名认证回调，无需后台登录。
      - /v1/pay/notify/wechat
      - /v1/pay/notify/alipay
      - /iceeboot/api/v1/pay/notify/wechat
      - /iceeboot/api/v1/pay/notify/alipay
      - /v1/pay/callback
      - /iceeboot/api/v1/pay/callback
      - /v1/auth/test/**
      - /v1/auth/wechat/auth-url
      - /v1/auth/wechat/innerQrCodeInfo-url
      - /v1/auth/wechat/callback
      - /v1/auth/wechat/check/**
      - /v1/auth/wechat/qr/**
      - /v1/auth/wechat/exchange-ticket
      - /v1/auth/login
      - /v1/auth/refresh
      - /v1/auth/register
      - /v1/auth/wechat/login
      - /v1/auth/captcha
      - /health
      - /doc.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
      - /favicon.ico
      - /error
      - /iceeboot/api/v1/auth/test/**
      - /iceeboot/api/v1/auth/wechat/auth-url
      - /iceeboot/api/v1/auth/wechat/callback
      - /iceeboot/api/v1/auth/wechat/exchange-ticket
      - /iceeboot/api/v1/auth/wechat/innerQrCodeInfo-url
      - /iceeboot/api/v1/auth/login
      - /iceeboot/api/v1/auth/refresh
      - /iceeboot/api/v1/auth/register
      - /iceeboot/api/v1/auth/wechat/login
      - /iceeboot/api/v1/auth/captcha
      - /iceeboot/api/health
      - /iceeboot/api/doc.html
      - /iceeboot/api/swagger-ui/**
      - /iceeboot/api/v3/api-docs/**
      - /iceeboot/api/webjars/**
      - /iceeboot/api/favicon.ico
      - /iceeboot/api/error
