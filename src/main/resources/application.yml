#
# @Description: 应用配置文件
# @Date: 2025-08-11
# @Author: CodeIcee
#

server:
  port: 9000
  servlet:
    context-path: /iceeboot/api
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  # 优雅关闭配置
  shutdown: graceful

spring:
  application:
    name: iceeboot-backend-java
  profiles:
    active: ${APP_PROFILE:local}
  main:
    allow-bean-definition-overriding: true
  # 优雅关闭超时时间
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 排除Spring Security、Elasticsearch、RabbitMQ自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration

  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  
  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.iceeboot.domain

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: accessToken
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: true
  # token风格
  token-style: random-128
  # 是否输出操作日志
  is-log: false
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从header中读取token
  is-read-header: true
  # 是否从body中读取token
  is-read-body: false
  # token前缀
  token-prefix: 
  # jwt秘钥
  jwt-secret-key: changliaokuowencangmangdadishuizhuchenfujuwangyishufengliurenwuqiekanjinzhao

# 日志配置
logging:
  level:
    com.iceeboot: debug
    org.springframework: warn
    org.mybatis: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/iceeboot.log
    max-size: 10MB
    max-history: 30

# Spring Boot Actuator配置
management:
  health:
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.iceeboot.framework.controller
  paths-to-match: /iceeboot/api/**, /v1/**, /api/v1/**



# 自定义配置
iceeboot:
  # 名称
  name: iceeboot超级脚手架
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2025
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/iceeboot/uploadPath，Linux配置 /home/iceeboot/uploadPath）
  profile: /home/iceeboot/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 日志存储配置
  log:
    # 是否启用日志存储到数据库
    enabled: true
    # 日志存储级别 (DEBUG, INFO, WARN, ERROR)
    level: INFO
    # 是否异步存储
    async: true
    # 日志保留天数
    retention-days: 30
    # 批量保存大小
    batch-size: 100
    # 是否记录请求参数
    log-request-params: false
    # 是否记录响应结果
    log-response-result: false
    # 排除的路径模式
    exclude-patterns:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /knife4j/**